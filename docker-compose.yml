# One-command local stack: Postgres + the poker app (with auto migrate + seed).
#   docker compose up --build
# Then open http://localhost:3001  (login: admin / admin1234)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
      POSTGRES_DB: poker
    # No host port is published: the app reaches Postgres over the internal
    # Docker network (db:5432), so this never clashes with a Postgres you already
    # run locally. To inspect the DB, use:  docker compose exec db psql -U poker poker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker -d poker"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://poker:poker@db:5432/poker
      # Override in a .env file next to this compose file for production.
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me-to-32-plus-random-chars}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin1234}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    # Host port is overridable if 3001 is taken: APP_PORT=3002 docker compose up
    ports:
      - "${APP_PORT:-3001}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
